<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="A simple way to send a thank-you.">
  <title>❤️ Send a Thank You</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213a;
      --muted: #63718a;
      --page: #f6f8fc;
      --surface: #fff;
      --line: #e2e8f1;
      --blue: #244cc9;
      --blue-hover: #193da9;
      --pink: #e94361;
      --shadow: 0 24px 70px rgba(30, 53, 100, .11);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      color: var(--ink);
      background: radial-gradient(ellipse at 12% 8%, rgba(63, 108, 228, .11), transparent 32rem), var(--page);
    }
    main { width: min(100%, 660px); }
    .card {
      overflow: hidden;
      border: 1px solid rgba(28, 49, 90, .08);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    header { padding: clamp(2rem, 7vw, 3.25rem) clamp(1.3rem, 7vw, 3.25rem) 1.7rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4.3vw, 2.4rem); line-height: 1.12; letter-spacing: -.05em; font-weight: 760; white-space: nowrap; }
    header p { margin: .9rem auto 0; max-width: 32rem; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }
    .methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; padding: 0 clamp(1rem, 5vw, 2.4rem) 1.5rem; }
    .method { min-width: 0; padding: .85rem .95rem; border: 1px solid var(--line); border-radius: 17px; background: #fff; align-self: start; }
    .method[open] { grid-column: 1 / -1; border-color: #cdd8ea; box-shadow: 0 10px 28px rgba(30, 53, 100, .07); }
    .method-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; column-gap: .45rem; row-gap: .22rem; cursor: pointer; list-style: none; }
    .method-top::-webkit-details-marker { display: none; }
    .method-top:focus-visible { outline: 3px solid #9bb5ff; outline-offset: 4px; border-radius: 6px; }
    .method-top::after { content: ""; grid-column: 1 / -1; grid-row: 2; justify-self: center; width: .55rem; height: .55rem; border-right: 2px solid #8290a7; border-bottom: 2px solid #8290a7; transform: rotate(45deg) translateY(-2px); transition: transform .15s ease; }
    .method[open] > .method-top::after { transform: rotate(225deg) translate(-2px, -1px); }
    h2 { display: flex; align-items: center; gap: .6rem; margin: 0; font-size: 1.05rem; line-height: 1.35; font-weight: 700; }
    .method-top h2 { grid-column: 1; grid-row: 1; min-width: 0; overflow-wrap: anywhere; }
    .brand-icon { width: 1.55rem; height: 1.55rem; flex: 0 0 auto; }
    svg.brand-icon:not([fill]) { fill: currentColor; }
    .brand-paypal { color: #003087; }
    .brand-wise { color: #1e9d69; }
    .brand-monobank { color: #111827; }
    .brand-bitcoin { color: #f7931a; }
    .brand-ethereum { color: #627eea; }
    .brand-tether { color: #26a17b; }
    .brand-usdc { color: #2775ca; }
    .brand-solana { color: #7855ff; }
    h2 .monobank-cat { width: 2.1rem; height: 2.1rem; object-fit: contain; }
    .method-meta { grid-column: 2; grid-row: 1; justify-self: end; margin: 0; padding: .16rem .4rem; border-radius: 99px; background: #f0f4fb; color: #53627c; font-size: .66rem; font-weight: 650; white-space: nowrap; }
    .method-meta:empty, .method-meta[hidden] { display: none; }
    .method > .content { margin-top: .9rem; }
    .payment-content { display: flex; flex-direction: column; align-items: center; gap: .8rem; text-align: center; }
    .payment-description { align-self: stretch; margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.5; text-align: center; }
    .payment-content .action { width: auto; max-width: 100%; align-self: center; }
    .payment-content .qr-block { width: min(100%, 210px); margin: 0; }
    .payment-content .qr-caption { text-align: center; }
    .mono-content { display: flex; flex-direction: column; align-items: center; gap: .8rem; text-align: center; }
    .mono-content .qr-block { width: min(100%, 210px); margin: 0; }
    .mono-content .qr-caption { text-align: center; }
    .action.action-paypal { border: 1px solid #d7e2f2; background: #fff; color: #17417b; box-shadow: 0 2px 8px rgba(31, 58, 100, .07); }
    .action.action-paypal .brand-icon { color: #17417b; }
    .action.action-paypal:hover { background: #f7f9fc; }
    .action.action-wise { border: 1px solid #d6e8dc; background: #fff; color: #28724f; box-shadow: 0 2px 8px rgba(31, 90, 61, .06); }
    .action.action-wise .brand-icon { color: #28724f; }
    .action.action-wise:hover { background: #f7fbf8; }
    .qr-block { width: min(100%, 220px); margin-top: .9rem; }
    .qr-link { display: block; padding: .45rem; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .qr-image { display: block; width: 100%; height: auto; border-radius: 9px; }
    .qr-caption { margin: .5rem 0 0; color: var(--muted); font-size: .84rem; line-height: 1.45; }
    .crypto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: .9rem; margin-top: .9rem; }
    .crypto-tile { min-width: 0; padding: .8rem; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfe; }
    .crypto-title { display: flex; align-items: center; gap: .45rem; font-size: .9rem; font-weight: 700; }
    .crypto-note { margin: .35rem 0 .65rem; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .crypto-tile .qr-block { width: 100%; margin-top: 0; }
    .coin-options { display: flex; flex-wrap: wrap; gap: .4rem; }
    .coin-option { display: inline-flex; min-height: 2.2rem; align-items: center; gap: .35rem; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; font-size: .78rem; font-weight: 650; cursor: pointer; }
    .coin-option .brand-icon { width: 1rem; height: 1rem; }
    .coin-option[aria-pressed="true"] { border-color: #244cc9; background: #eef3ff; color: #244cc9; }
    .coin-panel { display: flex; flex-direction: column; align-items: center; gap: .8rem; margin-top: .8rem; }
    .coin-panel .qr-block { width: min(100%, 210px); margin: 0; }
    .coin-panel .qr-caption { text-align: center; }
    .coin-panel-info { width: 100%; min-width: 0; text-align: center; }
    .coin-panel-title { display: flex; align-items: center; justify-content: center; gap: .45rem; margin: 0; font-size: .98rem; }
    .coin-panel-note { margin: .4rem auto 0; max-width: 34rem; color: var(--muted); font-size: .84rem; line-height: 1.45; }
    .items { display: grid; gap: .6rem; margin-top: .9rem; }
    .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .75rem; padding: .75rem .8rem; border-radius: 12px; background: #f7f9fc; }
    .item-label { display: flex; align-items: center; gap: .5rem; font-size: .91rem; font-weight: 650; }
    .item-value { overflow-wrap: anywhere; margin-top: .2rem; color: var(--muted); font-size: .86rem; line-height: 1.4; }
    .action { display: inline-flex; min-height: 2.7rem; align-items: center; justify-content: center; gap: .5rem; flex: 0 0 auto; padding: .62rem .9rem; border: 0; border-radius: 11px; background: var(--blue); color: #fff; font: inherit; font-size: .91rem; font-weight: 650; text-decoration: none; cursor: pointer; transition: background .15s ease, transform .15s ease; }
    .action:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .action:focus-visible { outline: 3px solid #9bb5ff; outline-offset: 3px; }
    .empty { margin-top: .7rem; color: var(--muted); font-size: .92rem; }
    footer { padding: 1rem; border-top: 1px solid #edf0f5; color: var(--muted); text-align: center; font-size: .84rem; }
    #toast { position: fixed; z-index: 5; right: 1rem; bottom: 1rem; max-width: min(25rem, calc(100vw - 2rem)); padding: .9rem 1.1rem; border-radius: 13px; background: #16233c; color: #fff; box-shadow: 0 12px 32px rgba(10, 20, 40, .23); font-size: .96rem; line-height: 1.45; opacity: 0; pointer-events: none; transform: translateY(.5rem); transition: opacity .18s ease, transform .18s ease; }
    #toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 600px) { .methods { grid-template-columns: 1fr; } .method { padding: .8rem .9rem; } .method-top h2 { font-size: .98rem; } .method-meta { font-size: .72rem; } .payment-content, .coin-panel { gap: .7rem; } }
    @media (max-width: 380px) { .coin-panel .qr-block { width: min(100%, 175px); } }
    @media (max-width: 460px) { body { padding: .8rem; } .card { border-radius: 21px; } header { padding-inline: 1rem; } h1 { font-size: clamp(1.05rem, 6vw, 1.45rem); } .item { padding: .7rem; } .action { padding-inline: .75rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>

      const iconPaths = {"paypal":"M15.607 4.653H8.941L6.645 19.251H1.82L4.862 0h7.995c3.754 0 6.375 2.294 6.473 5.513-.648-.478-2.105-.86-3.722-.86m6.57 5.546c0 3.41-3.01 6.853-6.958 6.853h-2.493L11.595 24H6.74l1.845-11.538h3.592c4.208 0 7.346-3.634 7.153-6.949a5.24 5.24 0 0 1 2.848 4.686M9.653 5.546h6.408c.907 0 1.942.222 2.363.541-.195 2.741-2.655 5.483-6.441 5.483H8.714Z","wise":"M6.488 7.469 0 15.05h11.585l1.301-3.576H7.922l3.033-3.507.01-.092L8.993 4.48h8.873l-6.878 18.925h4.706L24 .595H2.543l3.945 6.874Z","bitcoin":"M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.243 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-6.35-4.613c.24-1.59-.974-2.45-2.64-3.03l.54-2.153-1.315-.33-.525 2.107c-.345-.087-.705-.167-1.064-.25l.526-2.127-1.32-.33-.54 2.165c-.285-.067-.565-.132-.84-.2l-1.815-.45-.35 1.407s.975.225.955.236c.535.136.63.486.615.766l-1.477 5.92c-.075.166-.24.406-.614.314.015.02-.96-.24-.96-.24l-.66 1.51 1.71.426.93.242-.54 2.19 1.32.327.54-2.17c.36.1.705.19 1.05.273l-.51 2.154 1.32.33.545-2.19c2.24.427 3.93.257 4.64-1.774.57-1.637-.03-2.58-1.217-3.196.854-.193 1.5-.76 1.68-1.93h.01zm-3.01 4.22c-.404 1.64-3.157.75-4.05.53l.72-2.9c.896.23 3.757.67 3.33 2.37zm.41-4.24c-.37 1.49-2.662.735-3.405.55l.654-2.64c.744.18 3.137.524 2.75 2.084v.006z","ethereum":"M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z","tether":"M18.7538 10.5176c0 .6251-2.2379 1.1483-5.2381 1.2812l.0028.0007c-.0848.0064-.5233.0325-1.5012.0325-.7778 0-1.33-.0233-1.5237-.0325-3.0059-.1322-5.2495-.6555-5.2495-1.2819s2.2436-1.149 5.2495-1.2834v2.0442c.1965.0142.7594.0474 1.5372.0474.9334 0 1.4008-.0389 1.4849-.0466V9.2356c2.9994.1337 5.2381.657 5.2381 1.282zm5.19.5466L12.1248 22.389a.1803.1803 0 0 1-.2496 0L.0562 11.0635a.1781.1781 0 0 1-.0382-.2079l4.3762-9.1921a.1767.1767 0 0 1 .1626-.1026h14.8878a.1768.1768 0 0 1 .1612.1032l4.3762 9.1922a.1782.1782 0 0 1-.0382.2079zm-4.478-.4038c0-.8068-2.5515-1.4799-5.9473-1.6369V7.195h4.186V4.4055H6.3076V7.195h4.1852v1.8286c-3.4018.1562-5.9601.83-5.9601 1.6376 0 .8075 2.5583 1.4806 5.9601 1.6376v5.8618h3.025v-5.8639c3.394-.1563 5.948-.8295 5.948-1.6363z","solana":"m23.8764 18.0313-3.962 4.1393a.9201.9201 0 0 1-.306.2106.9407.9407 0 0 1-.367.0742H.4599a.4689.4689 0 0 1-.2522-.0733.4513.4513 0 0 1-.1696-.1962.4375.4375 0 0 1-.0314-.2545.4438.4438 0 0 1 .117-.2298l3.9649-4.1393a.92.92 0 0 1 .3052-.2102.9407.9407 0 0 1 .3658-.0746H23.54a.4692.4692 0 0 1 .2523.0734.4531.4531 0 0 1 .1697.196.438.438 0 0 1 .0313.2547.4442.4442 0 0 1-.1169.2297zm-3.962-8.3355a.9202.9202 0 0 0-.306-.2106.941.941 0 0 0-.367-.0742H.4599a.4687.4687 0 0 0-.2522.0734.4513.4513 0 0 0-.1696.1961.4376.4376 0 0 0-.0314.2546.444.444 0 0 0 .117.2297l3.9649 4.1394a.9204.9204 0 0 0 .3052.2102c.1154.049.24.0744.3658.0746H23.54a.469.469 0 0 0 .2523-.0734.453.453 0 0 0 .1697-.1961.4382.4382 0 0 0 .0313-.2546.4444.4444 0 0 0-.1169-.2297zM.46 6.7225h18.7815a.9411.9411 0 0 0 .367-.0742.9202.9202 0 0 0 .306-.2106l3.962-4.1394a.4442.4442 0 0 0 .117-.2297.4378.4378 0 0 0-.0314-.2546.453.453 0 0 0-.1697-.196.469.469 0 0 0-.2523-.0734H4.7596a.941.941 0 0 0-.3658.0745.9203.9203 0 0 0-.3052.2102L.1246 5.9687a.4438.4438 0 0 0-.1169.2295.4375.4375 0 0 0 .0312.2544.4512.4512 0 0 0 .1692.196.4689.4689 0 0 0 .2518.0739z"};
      const iconClasses = { BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether', USDC: 'usdc', SOL: 'solana' };
      document.querySelectorAll('details.method').forEach(current => current.addEventListener('toggle', () => {
        if (current.open) {
          document.querySelectorAll('details.method[open]').forEach(other => { if (other !== current) other.open = false; });
          loadImages(current);
        }
      }));
      function loadImages(scope) {
        scope.querySelectorAll('img[data-src]').forEach(img => {
          if (!img.hasAttribute('src')) img.src = img.dataset.src;
        });
      }
      function makeIcon(name) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        svg.classList.add('brand-icon', `brand-${name}`);
        if (iconPaths[name]) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', iconPaths[name]);
          svg.append(path);
        } else if (name === 'usdc') {
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '1.8');
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          const coin = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          coin.setAttribute('cx', '12'); coin.setAttribute('cy', '12'); coin.setAttribute('r', '9.2');
          const dollar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          dollar.setAttribute('d', 'M15.4 8.7c-.5-.7-1.4-1.1-2.8-1.1-1.6 0-2.7.8-2.7 2 0 3.1 5.8 1.1 5.8 4.3 0 1.3-1.2 2.2-3 2.2-1.3 0-2.4-.4-3.1-1.2M12.7 5.8v12.4');
          svg.append(coin, dollar);
        } else {
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '1.7');
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', '2.5'); rect.setAttribute('y', '5.5');
          rect.setAttribute('width', '19'); rect.setAttribute('height', '13'); rect.setAttribute('rx', '2');
          const stripe = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          stripe.setAttribute('d', 'M3 10h18M6 15h4');
          svg.append(rect, stripe);
        }
        return svg;
      }
      document.querySelectorAll('h2[data-icon]').forEach(heading => heading.prepend(makeIcon(heading.dataset.icon)));
      function setMeta(section, value) {
        const meta = section.querySelector('.method-meta');
        if (value) { meta.textContent = value; meta.hidden = false; }
        else meta.hidden = true;
      }
      function showThanks() {
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(() => toast.classList.remove('show'), 3200);
      }
      function setEmpty(section) {
        const message = document.createElement('p');
        message.className = 'empty';
        message.textContent = 'Payment details coming soon.';
        section.querySelector('.content').replaceChildren(message);
      }
      function addItem(section, label, value, actionText = 'Copy', iconName = 'bank') {
        const row = document.createElement('div');
        row.className = 'item';
        const info = document.createElement('div');
        const itemLabel = document.createElement('div');
        itemLabel.className = 'item-label';
        itemLabel.append(makeIcon(iconName), document.createTextNode(label));
        const itemValue = document.createElement('div');
        itemValue.className = 'item-value';
        itemValue.textContent = value;
        info.append(itemLabel, itemValue);
        const button = document.createElement('button');
        button.className = 'action';
        button.type = 'button';
        button.textContent = actionText;
        button.setAttribute('aria-label', `${actionText} ${label}`);
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(value);
            showThanks();
          } catch {
            const input = document.createElement('textarea');
            input.value = value;
            input.setAttribute('readonly', '');
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.append(input);
            input.select();
            const copied = document.execCommand('copy');
            input.remove();
            if (copied) showThanks();
          }
        });
        row.append(info, button);
        section.querySelector('.content').append(row);
      }
      function addDescription(section, text) {
        const description = document.createElement('p');
        description.className = 'payment-description';
        description.textContent = text;
        section.querySelector('.content').append(description);
      }
      function addLink(section, url, label = 'Open payment') {
        const link = document.createElement('a');
        link.className = 'action';
        const brand = ({ paypal: 'paypal', wise: 'wise' })[section.id];
        if (brand) {
          link.classList.add(`action-${brand}`);
          link.append(makeIcon(brand));
        }
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.append(document.createTextNode(label));
        link.addEventListener('click', showThanks);
        section.querySelector('.content').append(link);
      }
      function addQr(container, src, alt, caption) {
        if (typeof src !== 'string' || !src.trim()) return false;
        const block = document.createElement('div');
        block.className = 'qr-block';
        const link = document.createElement('a');
        link.className = 'qr-link';
        link.href = `./${src.replace(/^\.\//, '')}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', `Open ${alt} image in a new tab`);
        const img = document.createElement('img');
        img.className = 'qr-image';
        img.dataset.src = `./${src.replace(/^\.\//, '')}`;
        img.alt = alt;
        img.loading = 'lazy';
        link.append(img);
        const text = document.createElement('p');
        text.className = 'qr-caption';
        text.textContent = caption;
        block.append(link, text);
        container.append(block);
        return true;
      }
      function validUrl(value) {
        try { return new URL(value).protocol === 'https:'; } catch { return false; }
      }
      fetch('./payments.json', { cache: 'no-store' })
        .then(response => { if (!response.ok) throw new Error('Payment settings unavailable'); return response.json(); })
        .then(data => {
          const paypal = document.querySelector('#paypal');
          setMeta(paypal, data.paypal?.currency ? `Currency · ${data.paypal.currency}` : '');
          addDescription(paypal, data.paypal?.currency ? `Support via PayPal · ${data.paypal.currency}.` : 'Support via PayPal.');
          let paypalCount = 0;
          if (validUrl(data.paypal?.url || '')) { addLink(paypal, data.paypal.url, 'Pay with PayPal'); paypalCount++; }
          if (addQr(paypal.querySelector('.content'), data.paypal?.qrImage, 'PayPal payment QR code', 'Scan to open your PayPal payment page.')) paypalCount++;
          if (!paypalCount) setEmpty(paypal);

          const wise = document.querySelector('#wise');
          setMeta(wise, data.wise?.currencyLabel || 'Multi-currency');
          addDescription(wise, 'Send with Wise. Multi-currency payments are available.');
          let wiseCount = 0;
          if (validUrl(data.wise?.paymentUrl || '')) { addLink(wise, data.wise.paymentUrl, 'Send with Wise'); wiseCount++; }
          if (addQr(wise.querySelector('.content'), data.wise?.qrImage, 'Wise payment QR code', 'Scan to open your Wise payment link.')) wiseCount++;
          for (const [key, label] of [['accountHolder', 'Account holder'], ['email', 'Wise email'], ['iban', 'IBAN'], ['swift', 'SWIFT / BIC']]) {
            const value = data.wise?.[key];
            if (typeof value === 'string' && value.trim()) { addItem(wise, label, value.trim(), 'Copy', 'wise'); wiseCount++; }
          }
          if (!wiseCount) setEmpty(wise);

          const mono = document.querySelector('#monobank');
          setMeta(mono, data.monobank?.currency || 'UAH (₴)');
          addDescription(mono, 'Scan with Monobank or another banking app. Payments are in Ukrainian hryvnia (UAH).');
          let monoCount = 0;
          if (validUrl(data.monobank?.paymentUrl || '')) { addLink(mono, data.monobank.paymentUrl, 'Open Monobank'); monoCount++; }
          if (addQr(mono.querySelector('.content'), data.monobank?.qrImage, 'Monobank payment QR code', 'Scan with a banking app to pay in UAH (₴).')) monoCount++;
          for (const [key, label] of [['cardNumber', 'Card number'], ['iban', 'IBAN']]) {
            const value = data.monobank?.[key];
            if (typeof value === 'string' && value.trim()) { addItem(mono, label, value.trim(), 'Copy', 'monobank'); monoCount++; }
          }
          if (!monoCount) setEmpty(mono);

          const crypto = document.querySelector('#crypto');
          const coins = (Array.isArray(data.crypto) ? data.crypto : []).filter(coin => coin && (coin.qrImage || (typeof coin.address === 'string' && coin.address.trim())));
          setMeta(crypto, '');
          if (!coins.length) { setEmpty(crypto); return; }
          const picker = document.createElement('div');
          picker.className = 'coin-options';
          picker.setAttribute('role', 'group');
          picker.setAttribute('aria-label', 'Choose a cryptocurrency');
          const panel = document.createElement('div');
          panel.className = 'coin-panel';
          function selectCoin(selected) {
            panel.replaceChildren();
            const titleText = `${selected.currency || 'Crypto'} · ${selected.network || 'Network'}`;
            const icon = iconClasses[selected.currency] || 'bitcoin';
            const info = document.createElement('div');
            info.className = 'coin-panel-info';
            const title = document.createElement('h3');
            title.className = 'coin-panel-title';
            title.append(makeIcon(icon), document.createTextNode(titleText));
            info.append(title);
            if (typeof selected.note === 'string' && selected.note.trim()) {
              const note = document.createElement('p');
              note.className = 'coin-panel-note';
              note.textContent = selected.note;
              info.append(note);
            }
            const details = document.createElement('div');
            details.className = 'content';
            info.append(details);
            if (typeof selected.address === 'string' && selected.address.trim()) addItem(info, titleText, selected.address.trim(), 'Copy address', icon);
            panel.append(info);
            if (selected.qrImage) addQr(panel, selected.qrImage, `${titleText} QR code`, `Scan using a wallet on ${selected.network || 'this network'}.`);
            if (crypto.open) loadImages(panel);
          }
          coins.forEach((coin, index) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'coin-option';
            option.setAttribute('aria-pressed', String(index === 0));
            const optionLabel = coin.network ? `${coin.currency} · ${coin.network}` : coin.currency;
            option.append(makeIcon(iconClasses[coin.currency] || 'bitcoin'), document.createTextNode(optionLabel));
            option.addEventListener('click', () => {
              picker.querySelectorAll('.coin-option').forEach(button => button.setAttribute('aria-pressed', 'false'));
              option.setAttribute('aria-pressed', 'true');
              selectCoin(coin);
            });
            picker.append(option);
          });
          crypto.querySelector('.content').replaceChildren(picker, panel);
          selectCoin(coins[0]);
        })
        .catch(() => document.querySelectorAll('.method').forEach(setEmpty));
    })();
  </script>
